name: Actualizar tablero

on:
  schedule:
    - cron: "*/15 12-22 * * 1-5"   # cada 15 min de lunes a viernes, de 9 a 20 h (Argentina)
    - cron: "0 */3 * * *"          # el resto del tiempo, cada 3 horas
  workflow_dispatch:                # botón "Run workflow", con carga opcional del dato del día
    inputs:
      fecha:
        description: "Fecha del dato manual (AAAA-MM-DD). Vacío = no cargar"
        required: false
      compra:
        description: "Compra del BCRA en USD M"
        required: false
      reservas:
        description: "Reservas brutas en USD M (opcional)"
        required: false
      riesgo:
        description: "Riesgo país en puntos (opcional)"
        required: false

permissions:
  contents: write   # para guardar los datos en el repositorio
  pages: write      # para publicar la página
  id-token: write
  deployments: write # para destrabar publicaciones que quedaron colgadas

# Una sola ejecución a la vez: si llega otra, espera a que termine la anterior (así no chocan las publicaciones)
concurrency:
  group: tablero
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install xlrd pypdf

      - name: Generar tablero
        run: |
          ARGS="--no-abrir --salida docs/index.html"
          if [ -n "${{ github.event.inputs.fecha }}" ] && [ -n "${{ github.event.inputs.compra }}" ]; then
            ARGS="$ARGS --cargar ${{ github.event.inputs.fecha }} ${{ github.event.inputs.compra }}"
            [ -n "${{ github.event.inputs.reservas }}" ] && ARGS="$ARGS --reservas ${{ github.event.inputs.reservas }}"
          fi
          [ -n "${{ github.event.inputs.riesgo }}" ] && ARGS="$ARGS --riesgo ${{ github.event.inputs.riesgo }}"
          python grafico_bcra.py $ARGS

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Actualización automática $(date '+%d/%m %H:%M')"
          git pull --rebase
          git push

      - name: Preparar publicación
        uses: actions/configure-pages@v5

      - name: Subir la página
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Destrabar publicaciones anteriores colgadas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub a veces deja una publicación "en curso" que bloquea las nuevas: se cancelan las anteriores
          shas=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=20" --jq '.[].sha' 2>/dev/null | sort -u)
          for sha in 29480815bfa27a69b3c7d480f2cb3a793ea1d52d $shas; do
            [ "$sha" = "${{ github.sha }}" ] && continue
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "Cancelada: $sha" || true
          done

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
